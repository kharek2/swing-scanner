name: Institutional Swing Scanner

on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "0 = all NSE stock F&O symbols; use 5 for a quick diagnostic run"
        required: false
        default: "0"
  schedule:
    # Weekdays after NSE cash market close; GitHub cron uses UTC.
    - cron: "45 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: institutional-swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Syntax check
        run: python -m py_compile institutional_scanner.py
      - name: Unit tests
        run: pytest -q
      - name: Validate Dhan secret
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          if [ -z "$DHAN_ACCESS_TOKEN" ]; then
            echo "::error::DHAN_ACCESS_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Run F&O swing scan
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          LOOKBACK_DAYS: "260"
          MIN_SCORE: "55"
          MAX_SYMBOLS: ${{ inputs.max_symbols || '0' }}
          OUTPUT_DIR: reports
        run: python -u institutional_scanner.py
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-swing-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
