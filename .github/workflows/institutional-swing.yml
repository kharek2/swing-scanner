name: Institutional Swing Scanner

on:
  workflow_dispatch:
  schedule:
    # Weekdays after NSE cash market close; GitHub cron uses UTC.
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run F&O swing scan
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          LOOKBACK_DAYS: "260"
          MIN_SCORE: "55"
          OUTPUT_DIR: reports
        run: python institutional_scanner.py
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-swing-report-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
