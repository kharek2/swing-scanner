name: Intraday Scanner

on:
  schedule:
    - cron: "*/5 4-9 * * 1-5"
    - cron: "50-55/5 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install yfinance pandas
      - name: Run intraday scanner
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_TO: ${{ secrets.SEND_TO }}
        run: python intraday.py
      - name: Save sent list
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add sent_today.txt || true
          git commit -m "update sent list" || echo "nothing to commit"
          git push || true
